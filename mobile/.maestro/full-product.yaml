appId: cloud.margins.mobile
env:
  TEST_PASSWORD: ${MARGINS_MAESTRO_PASSWORD}
  TEST_USERNAME: ${MARGINS_MAESTRO_USERNAME}
  TEST_BOOK_ID: ${MARGINS_MAESTRO_BOOK_ID}
  TEST_DEBATE_TOPIC: ${MARGINS_MAESTRO_DEBATE_TOPIC}
  TEST_REFLECTION: ${MARGINS_MAESTRO_REFLECTION}
---
- runFlow: subflows/login.yaml
- openLink: "margins://books/${TEST_BOOK_ID}"
- assertVisible:
    id: book-detail-screen
- tapOn: "Open reading workspace"
- assertVisible:
    id: reading-session-screen
- tapOn: "Open reflection"
- assertVisible:
    id: reflection-screen
- tapOn: "Reflection"
- eraseText
- inputText: ${TEST_REFLECTION}
- tapOn: "Save reflection"
- assertVisible: ${TEST_REFLECTION}
- back
- tapOn: "Persona debate"
- assertVisible:
    id: debate-rooms-screen
- tapOn: "Debate topic"
- inputText: ${TEST_DEBATE_TOPIC}
- tapOn: "Create debate room"
- assertVisible:
    id: debate-room-screen
